# ─── Use this file for local development ────────────────────────────────────
# The active production profile is set by the SPRING_PROFILES_ACTIVE=prod env var on Render.

spring.application.name=InstituteManagementProject

server.servlet.context-path=/
server.port=8080

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/myinstitutedb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true

logging.level.in.thirutech.institute=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB
app.upload.dir=uploads/notes
