spring.application.name=InstituteManagementProject

# ===============================
# = SERVER
# ===============================
server.servlet.context-path=/
server.port=${PORT:8080}

# ===============================
# = DATA SOURCE — injected from environment variables
# ===============================
# SSL params MUST be in the URL itself (data-source-properties don't work with driver-class-name)
# SPRING_DATASOURCE_URL format: jdbc:mysql://host:port/db?sslMode=REQUIRED
spring.datasource.url=jdbc:mysql://ims-mysql-db-institude-management-system.a.aivencloud.com:25388/defaultdb?sslMode=REQUIRED&allowPublicKeyRetrieval=true
spring.datasource.username=avnadmin
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# = JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database=mysql
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
# Note: dialect auto-detected by Hibernate 6 — no need to set explicitly (unless JDBC metadata fails)

# ===============================
# = CONNECTION POOL (HikariCP)
# ===============================
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.connection-test-query=SELECT 1

spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true

# ===============================
# = LOGGING
# ===============================
logging.level.in.thirutech.institute=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
# Verbose DB/datasource logging to diagnose connection issues
logging.level.com.zaxxer.hikari=DEBUG
logging.level.com.mysql.cj=WARN

# ===============================
# = FILE UPLOAD
# ===============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB
app.upload.dir=uploads/notes
